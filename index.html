<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="description" content="A little celebration of love. Wedding details coming soon.">
  <title>Our Wedding</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3e493e;
      --muted: #73796e;
      --paper: #f7f3ed;
      --accent: #a56d5c;
      --line: #ded8ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }
    main {
      position: relative;
      width: min(100%, 760px);
      min-height: 620px;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 70px 28px;
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.36);
    }
    main::before, main::after {
      content: '✳';
      position: absolute;
      color: #b6a58d;
      font-size: 24px;
    }
    main::before { top: 24px; left: 26px; }
    main::after { right: 26px; bottom: 24px; }
    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent);
      font: 600 11px/1.5 system-ui, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(54px, 11vw, 94px);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .98;
    }
    .ampersand {
      display: block;
      margin: 14px 0;
      color: var(--accent);
      font-size: 42px;
      font-style: italic;
    }
    .intro {
      max-width: 430px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }
    .divider {
      width: 52px;
      height: 1px;
      margin: 34px 0 22px;
      background: var(--accent);
    }
    .details {
      margin: 0;
      color: var(--ink);
      font: 600 11px/1.7 system-ui, sans-serif;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    footer {
      position: absolute;
      bottom: 26px;
      color: var(--muted);
      font: 10px/1.5 system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    @media (max-width: 480px) {
      main { min-height: 570px; padding: 54px 20px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A celebration of love</p>
    <h1>Our<br>Wedding</h1>
    <span class="ampersand" aria-hidden="true">&amp;</span>
    <p class="intro">We’re so happy to share this special chapter with you. The date, names, and celebration details will be added here soon.</p>
    <span class="divider" aria-hidden="true"></span>
    <p class="details">Invitation details coming soon</p>
    <footer>With love, always</footer>
  </main>
</body>
</html>
